services:
  localstack:
    image: localstack/localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - GATEWAY_LISTEN=0.0.0.0:4566
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      - AWS_DEFAULT_REGION=${AWS_S3_REGION}
      - AWS_DEFAULT_S3_BUCKET=${AWS_DEFAULT_S3_BUCKET}
    volumes:
      - ./localstack:/etc/localstack/init/ready.d

  postgres:
    image: postgres:16
    container_name: typeorm-learning-postgres
    restart: unless-stopped
    ports:
      - "${DATABASE_PORT}:5432"
    environment:
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - typeorm_learning_data:/var/lib/postgresql/data

  maildev:
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "${MAIL_PORT}:1025"

volumes:
  typeorm_learning_data:
    external: true

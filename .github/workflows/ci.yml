name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Lint, migrate, seed and smoke test
        id: ci
        run: docker compose -f docker-compose.ci.yaml --env-file env-example-ci -p ci up --build --exit-code-from api

      - name: Copy prod.log from container
        if: ${{ failure() && steps.ci.conclusion == 'failure' }}
        run: docker cp ci-api-1:/usr/src/app/prod.log . || true

      - name: Upload prod.log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: prod-log
          path: prod.log
          if-no-files-found: ignore

      - name: Tear down
        if: ${{ always() }}
        run: docker compose -f docker-compose.ci.yaml --env-file env-example-ci -p ci down -v
